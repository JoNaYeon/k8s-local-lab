# ============================================================================
# Namespace — 쿠버네티스에서 리소스를 논리적으로 격리하는 단위
#
# 왜 네임스페이스를 나누는가?
#   - 앱과 모니터링 리소스를 분리하면 관리가 편하다
#   - 프로덕션에서는 팀/서비스/환경별로 네임스페이스를 분리한다
#   - RBAC(권한 제어)을 네임스페이스 단위로 적용할 수 있다
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: seemedi-dev          # 앱 + DB가 배포될 네임스페이스
  labels:
    purpose: application     # 라벨: 리소스를 분류하는 태그 (key: value)
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring           # Prometheus 등 모니터링 도구가 배포될 네임스페이스
  labels:
    purpose: observability
