# ============================================================================
# [base Kustomization] — 클러스터의 "기반" 리소스(네임스페이스)를 묶는 목차 파일
#
# 이 파일의 역할:
#   - `kubectl apply -k manifests/base/` 실행 시 아래 resources의 파일들을 적용한다.
#   - scripts/deploy-all.sh의 1단계("네임스페이스 생성")가 바로 이 디렉토리를 적용한다.
#   - 상위 manifests/kustomization.yml에서도 base/를 첫 번째로 포함한다.
#
# DevOps 관점에서 왜 필요한가?
#   - 네임스페이스는 다른 모든 리소스(앱, DB)가 들어갈 "그릇"이므로
#     반드시 가장 먼저 만들어져야 한다. 그래서 별도 디렉토리로 분리해
#     배포 순서를 명시적으로 제어한다. (참고: scripts/deploy-all.sh 상단 주석)
# ============================================================================

# Kustomize 설정 파일 선언 (형식은 최상위 manifests/kustomization.yml과 동일)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 이 디렉토리에서 배포할 파일 목록
resources:
  - namespaces.yml   # seemedi-dev, monitoring 두 네임스페이스 정의
