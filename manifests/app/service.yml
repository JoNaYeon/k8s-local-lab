# ============================================================================
# Service — Pod에 안정적인 네트워크 주소를 부여하는 리소스
#
# 왜 Service가 필요한가?
#   - Pod는 생성/삭제될 때마다 IP가 바뀐다
#   - Service는 고정된 이름(DNS)과 IP를 제공한다
#   - 여러 Pod에 트래픽을 분산(로드밸런싱)한다
#
# Service 타입:
#   - ClusterIP (기본): 클러스터 내부에서만 접근 가능
#   - NodePort: 노드의 특정 포트로 외부 접근 가능
#   - LoadBalancer: 클라우드의 로드밸런서 연동 (프로덕션)
#
# 이 Service는 ClusterIP 타입이다.
# 클러스터 내부에서 "sample-app.seemedi-dev.svc.cluster.local:80"으로 접근할 수 있다.
# 외부 접근은 Ingress가 담당한다.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: seemedi-dev
  labels:
    app: sample-app
spec:
  type: ClusterIP
  selector:
    app: sample-app             # 이 라벨을 가진 Pod에 트래픽을 보낸다
  ports:
    - port: 80                  # Service가 노출하는 포트
      targetPort: 8000          # Pod의 실제 포트 (FastAPI)
      protocol: TCP
