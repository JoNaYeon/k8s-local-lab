# ============================================================================
# [Secret] — 비밀 정보를 저장하는 쿠버네티스 리소스
#
# 비유: Secret = 사무실 "금고" (참고: docs/02-key-concepts.md — 7. Secret)
#   - DB 비밀번호, API 키, 인증서 같은 민감한 값 보관용
#   - 사용법은 ConfigMap과 동일하지만, RBAC로 접근을 더 엄격히 제한할 수 있다
#
# ⚠️ 중요: base64 인코딩 ≠ 암호화!
#   base64는 누구나 디코딩할 수 있다: echo "값" | base64 -d
#   이 파일은 학습용이므로 더미 값만 사용한다 (CLAUDE.md Security Rules).
#
# 프로덕션에서는: (참고: docs/05-production-mapping.md — 3. Secret)
#   - External Secrets Operator(ESO) + AWS Secrets Manager 또는 Vault 사용
#   - Secret YAML을 git에 커밋하지 않는다 (지금은 더미라서 커밋해도 됨)
#   - 비밀번호 로테이션을 자동화한다
#
# 이 파일이 미치는 영향:
#   - deployment.yml의 envFrom.secretRef가 이 이름(sample-app-secret)을 참조해
#     DATABASE_URL을 Pod의 환경 변수로 주입한다.
#   - 앱 코드(app/src/core/config.py)의 database_url 필드가 이 값으로 덮어써진다.
#
# base64 인코딩 방법 (새 값을 넣을 때):
#   echo -n "원본값" | base64        # -n 필수! 없으면 개행 문자까지 인코딩되어 값이 깨진다
# ============================================================================
apiVersion: v1                 # Secret은 core API 그룹(v1) 소속
kind: Secret
metadata:
  name: sample-app-secret      # deployment.yml의 secretRef.name과 정확히 일치해야 함
  namespace: seemedi-dev
# Opaque = "임의의 key-value" 타입 (가장 일반적).
# 이 외에 kubernetes.io/tls(인증서), kubernetes.io/dockerconfigjson(레지스트리 인증) 등이 있다.
type: Opaque
data:
  # 원본값: postgresql://seemedi:seemedi@postgres:5432/seemedi
  #   - seemedi:seemedi = DB 사용자/비밀번호 (database/configmap.yml, database/secret.yml과 일치)
  #   - postgres:5432   = DB 호스트명. database/service.yml의 Service 이름이 곧 DNS 이름이 된다
  #   - /seemedi        = 데이터베이스 이름
  # data 섹션의 값은 반드시 base64로 인코딩해야 한다 (stringData를 쓰면 평문 가능).
  DATABASE_URL: cG9zdGdyZXNxbDovL3NlZW1lZGk6c2VlbWVkaUBwb3N0Z3Jlczo1NDMyL3NlZW1lZGk=
