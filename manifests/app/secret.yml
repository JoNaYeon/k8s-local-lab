# ============================================================================
# Secret — 비밀 정보를 저장하는 쿠버네티스 리소스
#
# ⚠️ 중요: base64 인코딩 ≠ 암호화!
#   base64는 누구나 디코딩할 수 있다 (echo "값" | base64 -d).
#   이 파일은 학습용이므로 더미 값을 사용한다.
#
# 프로덕션에서는:
#   - External Secrets Operator (ESO) + AWS Secrets Manager 사용
#   - 또는 HashiCorp Vault 연동
#   - Secret YAML을 git에 커밋하지 않는다
#
# base64 인코딩 방법:
#   echo -n "원본값" | base64
#   예: echo -n "postgresql://seemedi:seemedi@postgres:5432/seemedi" | base64
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sample-app-secret
  namespace: seemedi-dev
type: Opaque
data:
  # postgresql://seemedi:seemedi@postgres:5432/seemedi
  DATABASE_URL: cG9zdGdyZXNxbDovL3NlZW1lZGk6c2VlbWVkaUBwb3N0Z3Jlczo1NDMyL3NlZW1lZGk=
