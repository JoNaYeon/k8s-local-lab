# ============================================================================
# HorizontalPodAutoscaler (HPA) — 부하에 따라 Pod 수를 자동 조절하는 리소스
#
# 비유: 마트 계산대
#   - 손님(트래픽)이 적으면 계산대(Pod) 2개만 운영
#   - 손님이 몰리면 자동으로 계산대를 5개까지 늘림
#   - 손님이 줄면 다시 2개로 줄임
#
# 동작 원리:
#   1. metrics-server가 각 Pod의 CPU/메모리 사용률을 수집
#   2. HPA가 평균 사용률을 확인
#   3. 목표(70%)를 초과하면 Pod를 추가
#   4. 목표 이하면 Pod를 제거
#
# ⚠️ 로컬 k3d에서는 metrics-server가 기본 설치되어 있어 바로 동작한다.
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-app-hpa
  namespace: seemedi-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-app              # 이 Deployment의 replicas를 조절
  minReplicas: 2                  # 최소 2개
  maxReplicas: 5                  # 최대 5개
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # CPU 평균 사용률이 70% 초과하면 스케일 아웃
