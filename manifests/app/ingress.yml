# ============================================================================
# [Ingress] — 클러스터 외부의 HTTP 요청을 내부 Service로 라우팅하는 리소스
#
# 비유: Ingress = 건물의 "안내 데스크" (참고: docs/02-key-concepts.md — 4. Ingress)
#   - 외부 방문자(HTTP 요청)가 들어오면
#   - 도메인 이름(host)과 경로(path)를 보고
#   - 맞는 Service(부서)로 안내한다
#
# 트래픽 흐름 (이 레포 기준):
#   브라우저(app.localhost:80)
#     → k3d 로드밸런서 (scripts/cluster-create.sh의 --port 80:80@loadbalancer)
#     → Ingress Controller (nginx — scripts/deploy-all.sh 2단계에서 설치)
#     → 이 Ingress 규칙으로 라우팅 결정
#     → Service sample-app:80 (service.yml)
#     → Pod의 8000 포트 (deployment.yml)
#
# DevOps 관점에서 왜 필요한가?
#   - Service마다 외부 포트를 따로 여는 대신, Ingress 하나가 80/443을 받고
#     도메인/경로 기준으로 여러 서비스에 분배한다 (진입점 단일화).
#   - TLS(HTTPS) 종료를 앱이 아닌 Ingress 계층에서 처리한다.
#
# 프로덕션에서 바뀌는 것: (참고: docs/05-production-mapping.md — 4. Ingress)
#   - host를 실제 도메인으로 변경 (예: app.seemedi.dev)
#   - cert-manager로 TLS 인증서 자동 발급 → spec.tls 섹션 추가
#   - 그 외 규칙 구조는 로컬과 완전히 동일하다
#
# 주의: Ingress 리소스는 "규칙"일 뿐이고, 실제로 트래픽을 처리하는 것은
#       Ingress Controller(nginx Pod)다. Controller가 없으면 이 파일은 아무 일도 하지 않는다.
# ============================================================================
apiVersion: networking.k8s.io/v1        # Ingress는 networking.k8s.io API 그룹 소속
kind: Ingress
metadata:
  name: sample-app-ingress              # Ingress 리소스 이름 (kubectl get ingress에서 보이는 이름)
  namespace: seemedi-dev                # 라우팅 대상 Service와 같은 네임스페이스여야 한다
  annotations:
    # annotation: Ingress Controller에게 전달하는 세부 옵션 (컨트롤러 구현체마다 다름).
    # ssl-redirect=false: HTTP 요청을 HTTPS로 강제 리다이렉트하지 않음.
    # 로컬에는 TLS 인증서가 없으므로 리다이렉트하면 접속이 실패한다.
    # 프로덕션에서는 "true"로 바꿔 HTTPS를 강제한다.
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    # 규칙 1: app.localhost 도메인으로 들어오는 요청 처리.
    # *.localhost는 OS가 항상 127.0.0.1로 해석하므로 /etc/hosts 수정 없이도
    # 대부분 동작한다. (안 되면: docs/03-local-setup-guide.md — Step 5 방법 2)
    - host: app.localhost
      http:
        paths:
          - path: /                     # 이 경로로 시작하는 요청을 대상으로 함
            # Prefix = "/로 시작하는 모든 경로" (/, /healthz, /api/... 전부 매칭).
            # Exact로 하면 정확히 "/"만 매칭되어 /healthz 등이 404가 난다.
            pathType: Prefix
            backend:
              service:
                name: sample-app        # 트래픽을 보낼 Service 이름 (service.yml의 metadata.name)
                port:
                  number: 80            # Service의 port (targetPort 8000이 아니라 Service 포트 80)
