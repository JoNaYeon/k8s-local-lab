# ============================================================================
# [Secret] — PostgreSQL 비밀번호
#
# 이 파일이 미치는 영향:
#   - statefulset.yml의 envFrom.secretRef가 이 이름(postgres-secret)을 참조해
#     POSTGRES_PASSWORD를 컨테이너 환경 변수로 주입한다.
#   - postgres 공식 이미지는 최초 기동 시 이 비밀번호로 사용자를 생성한다.
#   - 앱의 DATABASE_URL(manifests/app/secret.yml) 안의 비밀번호와 일치해야
#     앱이 DB에 접속할 수 있다.
#
# ⚠️ base64는 암호화가 아니다 — 학습용 더미 값만 사용 (CLAUDE.md Security Rules).
#    디코딩: echo "c2VlbWVkaQ==" | base64 -d  →  seemedi
#    인코딩: echo -n "seemedi" | base64        (-n 필수: 개행 포함 방지)
#
# 프로덕션에서는 External Secrets Operator + AWS Secrets Manager/Vault 사용.
# Secret YAML 자체를 git에 커밋하지 않는다.
# (참고: docs/05-production-mapping.md — 3. Secret,
#        manifests/app/secret.yml 상단 주석)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret          # statefulset.yml의 secretRef.name과 정확히 일치해야 함
  namespace: seemedi-dev
type: Opaque                     # 임의의 key-value 타입 (일반적인 Secret)
data:
  POSTGRES_PASSWORD: c2VlbWVkaQ==   # base64("seemedi") — 학습용 더미 비밀번호
