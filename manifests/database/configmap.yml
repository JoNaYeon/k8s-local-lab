# ============================================================================
# [ConfigMap] — PostgreSQL 접속 정보(비밀 아닌 것)와 초기화 SQL
#
# 이 ConfigMap은 두 가지 용도로 쓰인다 (statefulset.yml 참고):
#   1. 환경 변수 주입: POSTGRES_DB, POSTGRES_USER
#      → statefulset.yml의 envFrom.configMapRef가 통째로 주입
#   2. 파일 마운트: initdb.sql
#      → statefulset.yml의 volumes.configMap.items가 이 키를 꺼내
#        /docker-entrypoint-initdb.d/initdb.sql 파일로 만들어준다
#
# initdb.sql의 동작:
#   - postgres 공식 이미지는 "데이터 디렉토리가 비어있는 최초 기동 시에만"
#     /docker-entrypoint-initdb.d/ 안의 SQL을 자동 실행한다.
#   - 즉, 이미 데이터가 있는 상태에서 SQL을 바꿔도 재실행되지 않는다.
#     다시 실행하려면 PVC를 지우고(데이터 삭제) DB를 재배포해야 한다.
#
# DevOps 관점:
#   - DB 이름/사용자 같은 값을 매니페스트로 선언해두면, 클러스터를 지웠다
#     다시 만들어도 동일한 DB 환경이 재현된다 (Infrastructure as Code).
#   - 비밀번호는 여기 넣지 않는다 → database/secret.yml로 분리 (ConfigMap은 평문 노출).
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config          # statefulset.yml의 configMapRef.name / volumes.configMap.name과 일치해야 함
  namespace: seemedi-dev
data:
  # ── 환경 변수로 주입되는 값 ─────────────────────────────────────────────
  # postgres 공식 이미지가 최초 기동 시 이 값으로 DB와 사용자를 자동 생성한다.
  # 앱의 DATABASE_URL(app/secret.yml)에 있는 사용자/DB 이름과 일치해야 접속이 된다.
  POSTGRES_DB: "seemedi"         # 생성할 데이터베이스 이름
  POSTGRES_USER: "seemedi"       # 생성할 관리자 사용자 이름

  # ── 파일로 마운트되는 초기화 SQL ────────────────────────────────────────
  # "|" 는 YAML의 여러 줄 문자열 문법. 아래 내용 전체가 initdb.sql 파일이 된다.
  initdb.sql: |
    -- SEEMEDI 로컬 개발용 초기 스키마
    -- 프로덕션에서는 이런 방식 대신 마이그레이션 도구(Alembic 등)를 사용한다.
    -- (스키마 변경 이력을 코드로 관리하고, 롤백도 가능하게 하기 위함)

    -- 타임존 설정 (SEEMEDI 표준: KST)
    SET timezone = 'Asia/Seoul';

    -- 샘플 테이블: 앱의 Readiness Probe에서 DB 연결 확인용으로 사용할 수 있다
    -- (참고: app/src/main.py의 readyz — 현재는 더미 응답, 실전에서는 이 테이블 조회)
    CREATE TABLE IF NOT EXISTS health_check (
        id SERIAL PRIMARY KEY,                  -- 자동 증가 정수 ID
        checked_at TIMESTAMPTZ DEFAULT NOW(),   -- 타임존 포함 타임스탬프 (기본값: 현재 시각)
        status VARCHAR(10) DEFAULT 'ok'         -- 상태 문자열
    );

    -- 초기 데이터 1건 삽입 (SELECT로 바로 확인 가능하게)
    INSERT INTO health_check (status) VALUES ('ok');
