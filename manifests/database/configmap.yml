# ============================================================================
# ConfigMap — PostgreSQL 초기화 SQL과 설정
#
# initdb.sql은 PostgreSQL 컨테이너가 최초 시작할 때 자동 실행된다.
# 데이터베이스와 사용자를 생성하고, 권한을 부여한다.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: seemedi-dev
data:
  # PostgreSQL 서버 설정 오버라이드
  POSTGRES_DB: "seemedi"
  POSTGRES_USER: "seemedi"

  # 초기화 SQL — 컨테이너 최초 실행 시 /docker-entrypoint-initdb.d/ 에서 실행됨
  initdb.sql: |
    -- SEEMEDI 로컬 개발용 초기 스키마
    -- 프로덕션에서는 마이그레이션 도구(Alembic 등)를 사용한다

    -- 타임존 설정 (KST)
    SET timezone = 'Asia/Seoul';

    -- 샘플 테이블 (Health-check에서 DB 연결 확인용)
    CREATE TABLE IF NOT EXISTS health_check (
        id SERIAL PRIMARY KEY,
        checked_at TIMESTAMPTZ DEFAULT NOW(),
        status VARCHAR(10) DEFAULT 'ok'
    );

    INSERT INTO health_check (status) VALUES ('ok');
