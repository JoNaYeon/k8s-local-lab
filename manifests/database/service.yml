# ============================================================================
# Headless Service — StatefulSet용 서비스
#
# 일반 Service vs Headless Service:
#   - 일반 Service: 클러스터 IP가 할당되고, 트래픽을 Pod들에 분산
#   - Headless Service (clusterIP: None): 클러스터 IP 없음, DNS만 제공
#     → Pod에 직접 접근 가능: postgres-0.postgres.seemedi-dev.svc.cluster.local
#
# 왜 Headless Service인가?
#   - DB는 보통 특정 인스턴스에 직접 연결해야 한다 (Primary/Replica 구분)
#   - StatefulSet은 반드시 Headless Service와 함께 사용한다
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: seemedi-dev
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None                 # Headless Service
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
