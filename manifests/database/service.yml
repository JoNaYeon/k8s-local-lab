# ============================================================================
# [Headless Service] — StatefulSet(PostgreSQL)용 서비스
#
# 일반 Service vs Headless Service:
#   - 일반 Service: 가상 IP(ClusterIP)가 할당되고, 뒤의 Pod들에 트래픽을 분산
#   - Headless Service (clusterIP: None): 가상 IP 없음, DNS 이름만 제공
#     → DNS를 조회하면 로드밸런서를 거치지 않고 Pod의 실제 IP가 바로 나온다
#     → Pod별 고정 주소 가능: postgres-0.postgres.seemedi-dev.svc.cluster.local
#   (참고: docs/02-key-concepts.md — 3. Service 타입 표의 Headless)
#
# 왜 DB에는 Headless Service를 쓰는가? (DevOps 관점)
#   - DB는 "아무 Pod나"가 아니라 특정 인스턴스에 연결해야 한다.
#     예: 쓰기는 Primary(postgres-0)로만, 읽기는 Replica로 — 로드밸런싱하면 안 됨.
#   - StatefulSet은 Pod별 고정 DNS를 만들기 위해 Headless Service를 요구한다
#     (statefulset.yml의 serviceName 필드가 이 Service를 가리킨다).
#
# 이 파일이 미치는 영향:
#   - Service 이름 "postgres"가 클러스터 내부 DNS 이름이 된다.
#     앱의 DATABASE_URL(app/secret.yml)에 있는 호스트명 "postgres"가 바로 이것.
#   - scripts/port-forward.sh가 svc/postgres로 로컬 5432 포트를 연결한다.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres                  # 이 이름이 곧 DNS 이름 — statefulset.yml의 serviceName과 일치해야 함
  namespace: seemedi-dev
  labels:
    app: postgres
spec:
  type: ClusterIP                 # 내부 전용 (DB는 절대 클러스터 외부에 직접 노출하지 않는다)
  clusterIP: None                 # ★ 이 한 줄이 Headless Service를 만든다 (가상 IP 할당 안 함)
  selector:
    app: postgres                 # statefulset.yml의 Pod 라벨과 일치 — 이 라벨의 Pod를 DNS에 등록
  ports:
    - port: 5432                  # Service가 노출하는 포트
      targetPort: 5432            # 컨테이너의 실제 포트 (PostgreSQL 표준 포트라 동일하게 유지)
      protocol: TCP
